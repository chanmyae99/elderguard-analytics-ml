services:

  # Production ML pipeline service
  elderguard-ml:
    build: .
    container_name: elderguard-ml

    # Persist datasets, reports, and trained models outside the container
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./saved_model:/app/saved_model

    # Execute the main machine learning workflow
    command: python -m src.main

  # Separate service for hyperparameter tuning experiments
  tuning:
    build: .
    container_name: elderguard-tuning

    # Share the same persistent storage as the main pipeline
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./saved_model:/app/saved_model

    # Execute the tuning pipeline independently
    command: python -m src.tuning_pipeline