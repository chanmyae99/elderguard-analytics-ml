# ============================================================
# ElderGuard Analytics — Pipeline Configuration
# ============================================================


data:
  csv_path: "data/processed/gas_monitoring_processed.csv"
  raw_db_path: "data/raw/gas_monitoring.db"
  db_table: "gas_monitoring"
  processed_data_path: "data/processed/gas_monitoring_processed.csv"
  test_size: 0.2
  random_state: 42

preprocessing:
  drop_cols:
    - "Session ID"
  categorical_cols:
    - "Time of Day"
    - "HVAC Operation Mode"
    - "Ambient Light Level"
  target_col: "Activity Level"

imbalance_handling:
  # Set enabled: true to apply SMOTE after evaluating baseline models
  enabled: false

models:
  logistic_regression:
    C: 1.0
    max_iter: 1000
    solver: "lbfgs"

  random_forest:
    n_estimators: 700
    max_depth: 20
    min_samples_leaf: 2
    min_samples_split: 5
    max_features: "sqrt"
    class_weight: "balanced"
    reg_alpha: 0.5
    reg_lambda: 5
    n_jobs: -1
    random_state: 42

  xgboost:
    n_estimators: 900
    max_depth: 11
    learning_rate: 0.08
    subsample: 0.75
    colsample_bytree: 0.9
    n_jobs: -1
    random_state: 42

evaluation:
  cv_folds: 5
  metrics:
    - "accuracy"
    - "precision"
    - "recall"
    - "f1"

output:
  model_dir: "saved_model"
  report_dir: "reports"


tuning:
  scoring: "f1_weighted"
  cv_folds: 5
  n_iter: 80

  random_forest:
    n_estimators: [700, 900, 1100]
    max_depth: [null, 20, 25]
    min_samples_split: [2, 5]
    min_samples_leaf: [1, 2]

  xgboost:
    n_estimators: [500, 700, 900]
    learning_rate: [0.08, 0.1, 0.12]
    max_depth: [7, 9, 11]
    subsample: [0.75, 0.8, 0.85]
    colsample_bytree: [0.9, 1.0]